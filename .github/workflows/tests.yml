name: Python tests

on:
  push:
    branches: ["main", "upgrade/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile main.py test_scanner.py
      - name: Run scanner tests
        run: python -m unittest -v test_scanner.py
